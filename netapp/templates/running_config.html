<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Running Config - {{ device_ip }}</title>
    <style>
        body {
            font-family: monospace;
            background: #f4f6f9;
            padding: 20px;
            white-space: pre-wrap;
        }
        h2 {
            color: #1e90ff;
        }
        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Running Configuration for {{ device_ip }}</h2>
    {% if output %}
        <pre>{{ output }}</pre>
    {% else %}
        <p class="error">No output available.</p>
    {% endif %}
</body>
</html>
